apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-spanner
#gcloud projects add-iam-policy-binding projects/noogler-2 --role=roles/spanner.databaseUser --member=principal://iam.googleapis.com/projects/896536828389/locations/global/workloadIdentityPools/noogler-2.svc.id.goog/subject/ns/default/sa/k8s-spanner --condition=None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-front-deploy
  labels:
    app: spring-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-front
  template:
    metadata:
      labels:
        app: spring-front
    spec:
      serviceAccountName: k8s-spanner
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      terminationGracePeriodSeconds: 25
      topologySpreadConstraints:
      - maxSkew: 1                                 # ゾーン間の Pod 数の最大許容差（1 = ほぼ均等に分散）
        topologyKey: "topology.kubernetes.io/zone" # ゾーン単位で分散することを指定
        whenUnsatisfiable: DoNotSchedule           # 厳格
        labelSelector:
          matchLabels:
            app: spring-front                      # 分散対象にする自分自身の Pod ラベルを指定      
      containers:
      - name: spring-front-container
        image: asia-northeast1-docker.pkg.dev/noogler-2/app/gke-spring-native:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: PROJECT_ID
          value: noogler-2
        startupProbe:
          httpGet:
            path: /item
            port: 8080
          failureThreshold: 15
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /hostinfo
            port: 8080
        readinessProbe:
          httpGet:
            path: /item
            port: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-back-deploy
  labels:
    app: spring-back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-back
  template:
    metadata:
      labels:
        app: spring-back
    spec:
      serviceAccountName: k8s-spanner
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      terminationGracePeriodSeconds: 25
      topologySpreadConstraints:
      - maxSkew: 1                                 # ゾーン間の Pod 数の最大許容差（1 = ほぼ均等に分散）
        topologyKey: "topology.kubernetes.io/zone" # ゾーン単位で分散することを指定
        whenUnsatisfiable: DoNotSchedule           # 厳格
        labelSelector:
          matchLabels:
            app: spring-back                       # 分散対象にする自分自身の Pod ラベルを指定      
      containers:
      - name: spring-back-container
        image: asia-northeast1-docker.pkg.dev/noogler-2/app/gke-spring-native:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: PROJECT_ID
          value: noogler-2
        startupProbe:
          httpGet:
            path: /item
            port: 8080
          failureThreshold: 15
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /hostinfo
            port: 8080
        readinessProbe:
          httpGet:
            path: /item
            port: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: spring-front-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # コンテナネイティブ負荷分散（NEG）を有効化
spec:
  type: ClusterIP # 外部公開不要なため LoadBalancerからClusterIP に変更
  selector:
    app: spring-front
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spring-back-service
spec:
  type: ClusterIP # 外部公開不要なため LoadBalancerからClusterIP に変更
  selector:
    app: spring-back
  ports:
  - name: p1
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: p2
    protocol: TCP
    port: 8080
    targetPort: 8080
---
# Gatewayリソースの定義
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-http-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed # グローバル外部L7ロードバランサを指定
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
# HTTPRouteリソースの定義（ルーティング設定）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spring-front-route
spec:
  parentRefs:
  - name: external-http-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: / # / 以下のすべてのアクセスをフロントエンドにルーティング
    backendRefs:
    - name: spring-front-service
      port: 80